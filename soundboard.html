<!DOCTYPE html>
<html lang="en">

<head>
    <base href="https://cdn.jsdelivr.net/gh/fastyjay/soundboard@main/">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5521219086088837" crossorigin="anonymous"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WX5VS54ZDW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }
        gtag('js', new Date());
        gtag('config', 'G-WX5VS54ZDW');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcPlanet • Cosmic Test browser</title>
    <link rel="icon" type="image/jpeg" href="https://234517.neocities.org/calcplanet.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="sounds.js" type="module"></script>
    <script src="main.js" type="module"></script>
    <link href="style.css" rel="stylesheet">

    <style>
        /* ==========================================================================
           CalcPlanet Space Theme Override for Soundboard
           ========================================================================== */
        :root {
            --cp-bg: #090b10;
            --cp-card-bg: rgba(15, 23, 42, 0.7);
            --cp-card-hover: rgba(30, 41, 59, 0.8);
            --cp-border: rgba(255, 255, 255, 0.09);
            --cp-border-glow: rgba(99, 102, 241, 0.4);
            --cp-indigo: #6366f1;
            --cp-purple: #a855f7;
            --cp-cyan: #38bdf8;
            --cp-amber: #f59e0b;
            --cp-rose: #f43f5e;
            --font-heading: 'Fredoka', cursive, sans-serif;
            --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-display: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--cp-bg);
            color: #f8fafc;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.14) 0%, transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px;
            background-attachment: fixed;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Cosmic Top Glow Bar */
        .cp-navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1100;
            background: rgba(9, 11, 16, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.5);
        }

        .cp-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .cp-logo-wrap {
            position: relative;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #38bdf8);
            box-shadow: 0 0 16px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cp-logo-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .cp-brand-info {
            display: flex;
            flex-direction: column;
        }

        .cp-brand-title {
            font-family: var(--font-heading);
            font-size: 1.22rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #ffffff 40%, #c084fc 80%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
        }

        .cp-brand-tagline {
            font-family: var(--font-display);
            font-size: 0.68rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .cp-nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cp-nav-link {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #94a3b8;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }

        .cp-nav-link:hover {
            color: #ffffff;
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
        }

        /* Fixed Controls Toolbar */
        #controls {
            position: fixed;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 1080px;
            z-index: 1000;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            padding: 10px 16px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 18px;
            box-shadow: 0 12px 35px -10px rgba(0, 0, 0, 0.6), 0 0 25px rgba(99, 102, 241, 0.15);
        }

        /* Control Buttons Styling */
        .control-button {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            padding: 0.55rem 1.15rem;
            border: 1px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .control-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .control-button:active {
            transform: translateY(1px);
        }

        .favorites-toggle {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(217, 119, 6, 0.25));
            color: #fde047;
            border-color: rgba(245, 158, 11, 0.4);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
        }
        .favorites-toggle:hover {
            box-shadow: 0 0 22px rgba(245, 158, 11, 0.35);
            border-color: rgba(253, 224, 71, 0.7);
        }

        .overlap-toggle {
            background: rgba(30, 41, 59, 0.85);
            color: #cbd5e1;
            border-color: rgba(148, 163, 184, 0.2);
        }
        .overlap-toggle:hover {
            color: #ffffff;
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
        }

        .stop-button {
            background: linear-gradient(135deg, #e11d48, #be123c);
            color: #ffffff;
            border-color: rgba(253, 164, 175, 0.3);
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.35);
        }
        .stop-button:hover {
            box-shadow: 0 6px 22px rgba(225, 29, 72, 0.6);
        }

        .tts-toggle {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border-color: rgba(196, 181, 253, 0.35);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }
        .tts-toggle:hover {
            box-shadow: 0 6px 25px rgba(139, 92, 246, 0.55);
        }

        .tts-toggle-active {
            background: linear-gradient(135deg, #38bdf8, #06b6d4);
            color: #042f2e;
            border-color: #67e8f9;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        /* Search Input */
        #searchInput, #search-input {
            font-family: var(--font-body);
            padding: 0.55rem 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            flex: 1;
            min-width: 180px;
            font-size: 0.92rem;
            transition: all 0.2s ease;
        }

        #searchInput::placeholder, #search-input::placeholder {
            color: #64748b;
        }

        #searchInput:focus, #search-input:focus {
            outline: none;
            border-color: #818cf8;
            background: rgba(15, 23, 42, 0.98);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), 0 0 20px rgba(99, 102, 241, 0.2);
        }

        /* Soundboard Grid Container */
        #soundboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
            gap: 1.5rem;
            max-width: 1360px;
            margin: 154px auto 60px auto;
            padding: 0 24px;
            justify-content: center;
        }

        /* Sound Card Wrapper */
        .sound-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: var(--cp-card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--cp-border);
            border-radius: 20px;
            padding: 16px 12px 14px 12px;
            width: auto;
            min-height: 162px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .sound-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--btn-color, rgba(99, 102, 241, 0.6)), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .sound-wrapper:hover {
            transform: translateY(-5px) scale(1.02);
            background: var(--cp-card-hover);
            border-color: rgba(139, 92, 246, 0.4);
            box-shadow: 0 14px 30px -6px rgba(0, 0, 0, 0.6), 0 0 24px -4px var(--btn-color, rgba(99, 102, 241, 0.35));
            filter: none;
        }

        .sound-wrapper:hover::before {
            opacity: 1;
        }

        /* Sound Button & Circular Pad */
        .sound-button-img {
            all: unset;
            cursor: pointer;
            width: 82px;
            height: 82px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sound-image {
            width: 100%;
            height: 100%;
            background-color: var(--btn-color);
            background-image: url('https://cdn.jsdelivr.net/gh/fastyjay/soundboard@main/button.png');
            background-size: cover;
            background-position: center;
            background-blend-mode: multiply;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 16px var(--btn-color), inset 0 2px 4px rgba(255, 255, 255, 0.25);
            transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s, filter 0.2s;
        }

        .sound-image.pressed {
            background-image: url('https://cdn.jsdelivr.net/gh/fastyjay/soundboard@main/button_pressed.png');
            transform: scale(0.92);
            box-shadow: 0 0 28px var(--btn-color), inset 0 4px 8px rgba(0, 0, 0, 0.6);
            filter: brightness(1.25);
        }

        /* Sound Label */
        .sound-label {
            font-family: var(--font-heading);
            margin-top: 12px;
            text-align: center;
            font-size: 0.88rem;
            color: #f1f5f9;
            font-weight: 600;
            line-height: 1.25;
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }

        /* Context Menu / Right-Click Panel */
        .right-click-panel {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(99, 102, 241, 0.35) !important;
            border-radius: 14px !important;
            padding: 10px 12px !important;
            z-index: 1200;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 20px rgba(99, 102, 241, 0.2) !important;
            color: #f8fafc !important;
            font-family: var(--font-body);
        }

        .right-click-panel-label {
            font-family: var(--font-heading);
            font-size: 0.88rem;
            color: #c084fc !important;
            margin-bottom: 8px !important;
            letter-spacing: 0.02em;
        }

        .right-click-panel-button {
            padding: 6px 12px !important;
            background: rgba(99, 102, 241, 0.2) !important;
            color: #e0e7ff !important;
            border: 1px solid rgba(99, 102, 241, 0.35) !important;
            border-radius: 8px !important;
            font-size: 0.82rem !important;
            font-weight: 600 !important;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .right-click-panel-button:hover {
            background: #6366f1 !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
        }

        /* Text-to-Speech CalcPlanet Cosmic Modal */
        #ttsPanel {
            position: fixed;
            top: 135px;
            right: 24px;
            width: 390px;
            max-width: calc(100vw - 32px);
            z-index: 1050;
            background: rgba(11, 15, 26, 0.94);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(99, 102, 241, 0.25);
            display: flex;
            flex-direction: column;
            gap: 14px;
            font-family: var(--font-body);
            animation: tts-slide-in 0.24s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #ttsPanel.hidden {
            display: none;
        }

        .tts-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .tts-title {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 700;
            color: #c084fc;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tts-close {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .tts-close:hover {
            color: #ffffff;
            background: rgba(244, 63, 94, 0.2);
            border-color: rgba(244, 63, 94, 0.4);
        }

        .tts-textarea {
            width: 100%;
            min-height: 85px;
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .tts-textarea:focus {
            outline: none;
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }

        .tts-textarea::placeholder {
            color: #64748b;
        }

        .tts-controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .tts-label {
            font-family: var(--font-display);
            font-size: 0.72rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tts-val {
            font-size: 0.78rem;
            color: #38bdf8;
            font-variant-numeric: tabular-nums;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .tts-select {
            background: rgba(15, 23, 42, 0.95);
            color: #f1f5f9;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            padding: 7px 10px;
            font-size: 0.84rem;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            transition: border-color 0.2s;
        }

        .tts-select:focus {
            outline: none;
            border-color: #818cf8;
        }

        .tts-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 4px;
            background: rgba(30, 41, 59, 0.9);
            cursor: pointer;
            outline: none;
        }

        .tts-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #8b5cf6;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.8);
            transition: transform 0.1s;
        }

        .tts-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        .tts-status {
            font-family: var(--font-display);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: #94a3b8;
        }

        .tts-status--speaking {
            background: rgba(34, 197, 94, 0.15);
            border-color: rgba(34, 197, 94, 0.4);
            color: #4ade80;
        }
        .tts-status--paused {
            background: rgba(245, 158, 11, 0.15);
            border-color: rgba(245, 158, 11, 0.4);
            color: #fde047;
        }
        .tts-status--done {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.4);
            color: #a5b4fc;
        }
        .tts-status--error {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        .tts-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tts-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 10px;
            border: none;
            border-radius: 10px;
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .tts-btn-speak {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .tts-btn-pause {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #ffffff;
        }

        .tts-btn-resume {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #ffffff;
        }

        .tts-btn-stop {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #ffffff;
        }

        .tts-btn-reset {
            background: rgba(51, 65, 85, 0.8);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tts-speaking-display {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            padding: 8px 12px;
        }

        .tts-speaking-label {
            font-family: var(--font-display);
            font-size: 0.72rem;
            color: #94a3b8;
        }

        .tts-current-word {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 700;
            color: #c084fc;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #controls {
                top: 66px;
                width: calc(100% - 20px);
                padding: 8px 12px;
            }
            #soundboard {
                margin-top: 190px;
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 1rem;
                padding: 0 12px;
            }
            .sound-button-img {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>
    <!-- CalcPlanet Cosmic Top Bar -->
    <header class="cp-navbar">
        <a href="https://234517.neocities.org" class="cp-brand" target="_blank" rel="noopener noreferrer">
            <div class="cp-logo-wrap">
                <img src="https://234517.neocities.org/calcplanet.jpg" alt="CalcPlanet Logo" class="cp-logo-img" />
            </div>
            <div class="cp-brand-info">
                <span class="cp-brand-title">CalcPlanet</span>
                <span class="cp-brand-tagline">Assignment Tester</span>
            </div>
        </a>
        <div class="cp-nav-links">
            <a href="https://calcplanet.ai.studio/" class="cp-nav-link" target="_blank" rel="noopener noreferrer">BACK</a>
        </div>
    </header>

    <!-- Soundboard Controls -->
    <div id="controls">
        <button id="toggleFavorites" class="control-button favorites-toggle">⭐ Favorites: OFF</button>
        <button id="toggleButton" class="control-button overlap-toggle">🔇 Overlap: OFF</button>
        <button id="stopButton" class="control-button stop-button">⏹️ Stop All Sounds</button>
        <input id="searchInput" type="text" placeholder="Search sounds...">
        <button id="ttsToggle" class="control-button tts-toggle">🗣️ Text-to-Speech</button>
    </div>

    <!-- Text-to-Speech Panel -->
    <div id="ttsPanel" class="tts-panel hidden">
        <div class="tts-panel-header">
            <span class="tts-title">🎙️ Text-to-Speech</span>
            <button id="ttsClose" class="tts-close">✕</button>
        </div>
        <textarea id="ttsText" class="tts-textarea" placeholder="Type something to speak..."></textarea>
        <div class="tts-controls-grid">
            <div class="tts-control-group full-width">
                <label class="tts-label">Voice</label>
                <select id="ttsVoice" class="tts-select"></select>
            </div>
            <div class="tts-control-group">
                <label class="tts-label">Volume <span id="ttsVolumeVal" class="tts-val">1.0</span></label>
                <input type="range" id="ttsVolume" class="tts-slider" min="0" max="1" step="0.05" value="1">
            </div>
            <div class="tts-control-group">
                <label class="tts-label">Rate <span id="ttsRateVal" class="tts-val">1.0</span></label>
                <input type="range" id="ttsRate" class="tts-slider" min="0.1" max="10" step="0.1" value="1">
            </div>
            <div class="tts-control-group">
                <label class="tts-label">Pitch <span id="ttsPitchVal" class="tts-val">1.0</span></label>
                <input type="range" id="ttsPitch" class="tts-slider" min="0" max="2" step="0.05" value="1">
            </div>
            <div class="tts-control-group">
                <label class="tts-label">Filter by Lang</label>
                <select id="ttsLangFilter" class="tts-select"></select>
            </div>
        </div>
        
        <div id="ttsStatus" class="tts-status">Ready</div>

        <div class="tts-actions">
            <button id="ttsSpeak" class="tts-btn tts-btn-speak">▶ Speak</button>
            <button id="ttsPause" class="tts-btn tts-btn-pause" disabled>⏸ Pause</button>
            <button id="ttsResume" class="tts-btn tts-btn-resume" disabled>▶ Resume</button>
            <button id="ttsStop" class="tts-btn tts-btn-stop" disabled>⏹ Stop</button>
            <button id="ttsReset" class="tts-btn tts-btn-reset">↺ Reset</button>
        </div>

        <div id="ttsSpeaking" class="tts-speaking-display hidden">
            <span class="tts-speaking-label">Now speaking:</span>
            <span id="ttsCurrentWord" class="tts-current-word"></span>
        </div>
    </div>

    <!-- Generated Soundboard Buttons -->
    <div id="soundboard"></div>
</body>

</html>
